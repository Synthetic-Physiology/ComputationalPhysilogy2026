[project]
name = "embryo-sim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fx-sr", email = "fxsr@fxsr.net" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "numba>=0.68.1",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "scipy>=1.18.1",
]

[project.scripts]
embryo-sim = "embryo_sim:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
